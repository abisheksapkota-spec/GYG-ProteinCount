# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: protein-count
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # paste a PostgreSQL connection string (e.g. a free Neon database)
