name: Tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: npc_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: test, MYSQL_DATABASE: npc_test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -ptest" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: SQLite
        run: pytest -q
      - name: PostgreSQL
        run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/npc_test" }
      - name: MySQL
        run: pytest -q
        env: { TEST_DATABASE_URL: "mysql://root:test@127.0.0.1:3306/npc_test" }
